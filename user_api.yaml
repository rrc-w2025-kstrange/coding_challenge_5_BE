openapi: 3.0.0
info:
    title: My API
    version: 1.0.0
paths:
    /users:
        get:
            summary: Get all users
            responses:
                "200":
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    $ref: "#/components/validations/User"
components:
    schemas:
        User:
            type: object
            properties:
                id:
                    type: string
                name:
                    type: string
                email:
                    type: string